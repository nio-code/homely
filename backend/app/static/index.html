<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Homely — Irvine Deals</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <a class="logo" href="/">
        <!-- house outline SVG -->
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#cc0000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/>
          <polyline points="9 21 9 12 15 12 15 21"/>
        </svg>
        <span class="logo-text">Homely</span>
      </a>
      <div class="header-right">
        <button id="search-btn" class="primary small">Find Listings</button>
        <span id="status" class="status-dot"></span>
      </div>
    </div>
  </header>

  <div id="search-panel" class="search-panel hidden">
    <div class="search-head">
      <strong id="search-state">Idle</strong>
      <span id="search-counts" class="counts"></span>
      <button id="search-close" class="ghost small">Close</button>
    </div>
    <pre id="search-log"></pre>
  </div>

  <div class="main">

    <section class="tray-section" id="tray-section" style="display:none">
      <div class="section-title">
        Saved Homes
        <span id="tray-count" class="pill">0</span>
      </div>
      <div id="tray" class="grid"></div>
    </section>

    <div class="filter-bar">
      <span class="filter-label">Filter</span>
      <div class="filter-divider"></div>
      <input id="f-zip"  type="text"   placeholder="ZIP"       inputmode="numeric" maxlength="5" />
      <input id="f-min"  type="number" placeholder="Min price" min="0" step="50000" />
      <input id="f-max"  type="number" placeholder="Max price" min="0" step="50000" />
      <input id="f-beds" type="number" placeholder="Min beds"  min="0" step="0.5" />
      <div class="filter-actions">
        <button id="f-apply" class="primary small">Apply</button>
        <button id="f-clear" class="ghost small">Clear</button>
      </div>
    </div>

    <div class="tabs-bar">
      <button class="tab active" data-tab="approved">For Sale <span id="tab-count-approved" class="count">(0)</span></button>
      <button class="tab" data-tab="pending">Pending Review <span id="tab-count-pending" class="count">(0)</span></button>
    </div>

    <div id="list" class="grid"></div>

  </div>

  <div id="toast" class="toast"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
